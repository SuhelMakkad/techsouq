<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
>
  <title>A portal, scoped. One client task, a complete outcome.</title>
  <desc>
    The approval workflow goes from publishing a deliverable to reviewing a version, making a
    decision, and recording the outcome. A change request returns to publishing a new version.
  </desc>
  <rect width="1200" height="630" fill="#f7f8fb" />
  <circle cx="1115" cy="5" r="220" stroke="#e4eaf6" stroke-width="40" />
  <circle cx="1115" cy="5" r="140" stroke="#e4eaf6" stroke-width="1" />

  <g font-family="Manrope, Arial, sans-serif" fill="#18202f">
    <g transform="translate(60 45) scale(0.04)" fill="#2061ef">
      <path
        d="M 80,356.583592 V 272 C 80,237 100,206 132,190 L 400,56 Q 432,40 464,56 L 570.533747,109.266874 A 12,12 0 0 1 570.533747,130.733126 L 97.366563,367.316718 A 12,12 0 0 1 80,356.583592 Z"
      />
      <path
        d="M 86.633437,436.683282 L 270.633437,344.683282 A 12,12 0 0 1 288,355.416408 L 288,612.583592 A 12,12 0 0 1 270.633437,623.316718 L 132,554 C 100,538 80,507 80,472 L 80,447.416408 A 12,12 0 0 1 86.633437,436.683282 Z"
      />
      <path
        d="M 406.633437,276.683282 L 446.8,256.6 Q 472,244 497.2,257.86 L 668,351.8 C 700,369.4 720,400 720,436 V 568 C 720,600 702,625 672,640 L 456,748 Q 432,760 408,748 L 406.633437,747.316718 A 12,12 0 0 1 400,736.583592 L 400,287.416408 A 12,12 0 0 1 406.633437,276.683282 Z"
      />
    </g>
    <text x="104" y="69" font-size="18" font-weight="700">TECHSOUQ</text>
    <text x="1136" y="69" font-size="14" letter-spacing="2" text-anchor="end" fill="#536176">
      PRODUCT PLANNING / 02
    </text>

    <text x="64" y="150" font-size="64" font-weight="750" letter-spacing="-2.5">
      A portal, scoped.
    </text>
    <text x="66" y="195" font-size="27" fill="#536176">One client task. A complete outcome.</text>
    <rect x="64" y="235" width="1072" height="308" rx="24" fill="white" stroke="#dfe5ef" />

    <path d="M306 353H350M560 353H604M814 353H858" fill="none" stroke="#a9b8d2" stroke-width="2" />
    <path
      d="m342 347 8 6-8 6m254-12 8 6-8 6m254-12 8 6-8 6"
      fill="none"
      stroke="#a9b8d2"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <rect x="96" y="288" width="210" height="132" rx="16" fill="#f2f5fb" stroke="#dfe5ef" />
    <rect x="350" y="288" width="210" height="132" rx="16" fill="#f2f5fb" stroke="#dfe5ef" />
    <rect x="604" y="288" width="210" height="132" rx="16" fill="#2061ef" />
    <rect x="858" y="288" width="246" height="132" rx="16" fill="#f2f5fb" stroke="#dfe5ef" />

    <text x="118" y="320" font-size="13" font-weight="700" letter-spacing="1.3" fill="#536176">
      TEAM
    </text>
    <text x="118" y="357" font-size="24" font-weight="700">Publish</text>
    <text x="118" y="391" font-size="16" fill="#536176">A specific version</text>
    <text x="372" y="320" font-size="13" font-weight="700" letter-spacing="1.3" fill="#536176">
      CLIENT
    </text>
    <text x="372" y="357" font-size="24" font-weight="700">Review</text>
    <text x="372" y="391" font-size="16" fill="#536176">The right deliverable</text>
    <text x="626" y="320" font-size="13" font-weight="700" letter-spacing="1.3" fill="#dce8ff">
      APPROVER
    </text>
    <text x="626" y="357" font-size="24" font-weight="700" fill="white">Decide</text>
    <text x="626" y="391" font-size="16" fill="#dce8ff">Approve or revise</text>
    <text x="880" y="320" font-size="13" font-weight="700" letter-spacing="1.3" fill="#536176">
      BOTH SIDES
    </text>
    <text x="880" y="357" font-size="24" font-weight="700">Record</text>
    <text x="880" y="391" font-size="16" fill="#536176">Who · what · when</text>

    <path
