    <text x="458" y="491" font-size="15" font-weight="600" text-anchor="middle" fill="#2061ef">
      Changes → new version
    </text>
    <text x="64" y="589" font-size="17" fill="#536176">
      First release: complete the loop, including access and recovery.
    </text>
  </g>
</svg>
