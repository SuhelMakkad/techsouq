<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="dns-title dns-description">
  <title id="dns-title">Only the website address changes</title>
  <desc id="dns-description">In the test, changing only the website A record moves the incoming mail lookup from the old mail server to the new web server and changes the existing sender’s SPF result from pass to fail.</desc>
  <rect width="1200" height="630" fill="#f7f8fb" />

  <g font-family="Manrope, Arial, sans-serif" fill="#18202f">
    <text x="72" y="86" font-size="38" font-weight="700" fill="#174dbd">DNS example · Same MX and SPF records</text>
    <text x="70" y="157" font-size="64" font-weight="700" letter-spacing="-2">Only the website address changes</text>

    <g transform="translate(72 209)">
      <rect width="510" height="363" rx="28" fill="#fff" stroke="#b9cff9" stroke-width="2" />
      <path d="M1 86h508M32 222h446" stroke="#dae5f8" stroke-width="2" />
      <text x="32" y="57" font-size="44" font-weight="700" fill="#174dbd">Before</text>
      <text x="32" y="138" font-size="40" fill="#40506a">Incoming lookup</text>
      <text x="32" y="195" font-size="52" font-weight="700">Old mail server</text>
      <text x="32" y="277" font-size="40" fill="#40506a">Sender SPF</text>
      <text x="32" y="333" font-size="52" font-weight="700">Pass</text>
    </g>

    <g transform="translate(618 209)">
      <rect width="510" height="363" rx="28" fill="#fff" stroke="#b9cff9" stroke-width="2" />
      <path d="M1 86h508M32 222h446" stroke="#dae5f8" stroke-width="2" />
      <text x="32" y="57" font-size="44" font-weight="700" fill="#174dbd">After</text>
      <text x="32" y="138" font-size="40" fill="#40506a">Incoming lookup</text>
      <text x="32" y="195" font-size="52" font-weight="700">New web server</text>
      <text x="32" y="277" font-size="40" fill="#40506a">Sender SPF</text>
      <text x="32" y="333" font-size="52" font-weight="700">Fail</text>
    </g>
  </g>
</svg>
