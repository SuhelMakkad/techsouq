    </g>
    <text x="104" y="69" font-size="18" font-weight="700">TECHSOUQ</text>
    <text x="1136" y="69" font-size="14" letter-spacing="2" text-anchor="end" fill="#536176">BUSINESS SYSTEMS</text>

    <text x="64" y="153" font-size="58" font-weight="750" letter-spacing="-2.3">One job. One verified outcome.</text>
    <text x="66" y="199" font-size="26" fill="#536176">Repeated notifications should not create repeated work.</text>

    <rect x="64" y="265" width="244" height="122" rx="18" fill="#e4eaf6" stroke="#c9d2e1" />
