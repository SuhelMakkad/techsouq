    <text x="210" y="379" font-size="20" fill="#536176" text-anchor="middle">Same business job</text>

    <path d="M346 350H412" fill="none" stroke="#2061ef" stroke-width="4" stroke-linecap="round" />
    <path d="m399 340 13 10-13 10" fill="none" stroke="#2061ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="436" y="289" width="326" height="122" rx="18" fill="#2061ef" />
    <text x="599" y="341" font-size="30" font-weight="750" fill="white" text-anchor="middle">Check</text>
    <text x="599" y="380" font-size="30" font-weight="750" fill="white" text-anchor="middle">existing work</text>

    <path d="M786 350H870" fill="none" stroke="#2061ef" stroke-width="4" stroke-linecap="round" />
