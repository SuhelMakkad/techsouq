<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  role="img"
  aria-labelledby="recovery-title recovery-description"
>
  <title id="recovery-title">Can your business recover?</title>
  <desc id="recovery-description">A conceptual timeline separates two recovery targets around an outage. RPO looks backward to the recoverable data point: how much work could be missing? RTO looks forward to service restoration: how long until work resumes?</desc>
  <rect width="1200" height="630" fill="#f7f8fb" />
  <circle cx="1115" cy="5" r="220" stroke="#e4eaf6" stroke-width="40" />
  <circle cx="1115" cy="5" r="140" stroke="#e4eaf6" stroke-width="1" />

  <g font-family="Manrope, Arial, sans-serif" fill="#18202f">
    <g transform="translate(60 45) scale(0.04)" fill="#2061ef">
      <path d="M 80,356.583592 V 272 C 80,237 100,206 132,190 L 400,56 Q 432,40 464,56 L 570.533747,109.266874 A 12,12 0 0 1 570.533747,130.733126 L 97.366563,367.316718 A 12,12 0 0 1 80,356.583592 Z" />
      <path d="M 86.633437,436.683282 L 270.633437,344.683282 A 12,12 0 0 1 288,355.416408 L 288,612.583592 A 12,12 0 0 1 270.633437,623.316718 L 132,554 C 100,538 80,507 80,472 L 80,447.416408 A 12,12 0 0 1 86.633437,436.683282 Z" />
      <path d="M 406.633437,276.683282 L 446.8,256.6 Q 472,244 497.2,257.86 L 668,351.8 C 700,369.4 720,400 720,436 V 568 C 720,600 702,625 672,640 L 456,748 Q 432,760 408,748 L 406.633437,747.316718 A 12,12 0 0 1 400,736.583592 L 400,287.416408 A 12,12 0 0 1 406.633437,276.683282 Z" />
    </g>
    <text x="104" y="69" font-size="18" font-weight="700">TECHSOUQ</text>
    <text x="1136" y="69" font-size="14" letter-spacing="2" text-anchor="end" fill="#536176">BUSINESS SYSTEMS / 05</text>

    <text x="64" y="151" font-size="62" font-weight="750" letter-spacing="-2.5">Can your business recover?</text>
    <text x="66" y="196" font-size="27" fill="#536176">Agree two targets before choosing backups.</text>

    <rect x="64" y="235" width="1072" height="308" rx="24" fill="white" stroke="#dfe5ef" />
    <text x="126" y="288" font-size="20" font-weight="700" fill="#2061ef">Recovery point</text>
    <text x="600" y="288" font-size="20" font-weight="700" text-anchor="middle">Outage</text>
    <text x="1074" y="288" font-size="20" font-weight="700" text-anchor="end">Service restored</text>

    <path d="M600 307V515" stroke="#c9d2e1" stroke-width="2" stroke-dasharray="5 6" />
    <path d="M566 330H134" stroke="#2061ef" stroke-width="4" stroke-linecap="round" />
    <path d="m148 320-14 10 14 10" stroke="#2061ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M634 330H1066" stroke="#18202f" stroke-width="4" stroke-linecap="round" />
    <path d="m1052 320 14 10-14 10" stroke="#18202f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="600" cy="330" r="12" fill="#18202f" />

    <rect x="96" y="371" width="464" height="143" rx="16" fill="#edf3ff" />
    <text x="126" y="405" font-size="16" font-weight="750" letter-spacing="1.4" fill="#2061ef">RPO / DATA GAP</text>
    <text x="126" y="449" font-size="30" font-weight="750">How much work</text>
    <text x="126" y="487" font-size="30" font-weight="750">could be missing?</text>

    <rect x="640" y="371" width="464" height="143" rx="16" fill="#18202f" />
    <text x="670" y="405" font-size="16" font-weight="750" letter-spacing="1.4" fill="#bacbf2">RTO / DOWNTIME</text>
    <text x="670" y="449" font-size="30" font-weight="750" fill="white">How long until</text>
    <text x="670" y="487" font-size="30" font-weight="750" fill="white">work resumes?</text>

    <text x="64" y="589" font-size="18" fill="#536176">Agree the targets. Restore the data. Test a real workflow.</text>
    <text x="1136" y="589" font-size="14" text-anchor="end" fill="#536176">Conceptual timeline</text>
  </g>
</svg>
